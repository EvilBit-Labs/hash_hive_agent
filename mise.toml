
# Several tools are pinned to "latest" to enable the idiomatic version file support. The version is managed by a version file.
[tools]
rust                   = { version = "latest", components = "llvm-tools,cargo,rustfmt,clippy", profile = "default", targets = "aarch64-apple-darwin,aarch64-unknown-linux-gnu,x86_64-apple-darwin,x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl,x86_64-pc-windows-msvc" }
cargo-binstall         = "latest"
"cargo:cargo-audit"    = "0.22.1"
"cargo:cargo-deny"     = "0.19.0"
"cargo:cargo-dist"     = "0.31.0"
"cargo:cargo-llvm-cov" = "0.8.4"
"cargo:cargo-nextest"  = "0.9.129"
"cargo:cargo-outdated" = "0.17.0"
"cargo:cargo-release"  = "1.1.1"
"cargo:cargo-machete"  = "0.9.1"
"cargo:git-cliff"      = "2.12.0"
just                   = "latest"
python                 = "latest"
"pipx:mdformat"        = { version = "1.0.0", uvx_args = "--with mdformat-gfm --with mdformat-admon --with mdformat-config --with mdformat-footnote --with mdformat-simple-breaks --with mdformat-web --with mdformat-ruff --with mdformat-gfm-alerts --with mdformat-toc --with mdformat-front-matters" }
prettier               = "3.8.1"
actionlint             = "1.7.11"
lychee                 = "0.23.0"
markdownlint-cli2      = "0.21.0"
"pipx:pre-commit"      = "latest"

[settings]
activate_aggressive                 = true
idiomatic_version_file_enable_tools = [ "python", "rust" ]
env_cache                           = true
exec_auto_install                   = true
github_attestations                 = true
lockfile                            = true
pin                                 = true
slsa                                = true

[settings.pipx]
uvx = true
